<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found | ProPrint Studio Pro</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-4">
    <div class="max-w-md w-full bg-slate-900 border border-slate-800 rounded-3xl p-8 text-center space-y-6 shadow-2xl relative overflow-hidden">
        
        <div class="absolute -top-24 -left-24 w-48 h-48 bg-indigo-600/20 rounded-full blur-3xl pointer-events-none"></div>
        <div class="absolute -bottom-24 -right-24 w-48 h-48 bg-purple-600/20 rounded-full blur-3xl pointer-events-none"></div>

        <div class="w-20 h-20 mx-auto rounded-3xl bg-indigo-600/20 text-indigo-400 border border-indigo-500/30 flex items-center justify-center text-3xl shadow-lg">
            <i class="fa-solid fa-print"></i>
        </div>

        <div class="space-y-2">
            <span class="font-mono text-xs font-bold px-3 py-1 rounded-full bg-rose-500/10 text-rose-400 border border-rose-500/20">
                ERROR 404 &bull; PAGE NOT FOUND
            </span>
            <h1 class="text-3xl font-extrabold text-white">Lost in Print Space?</h1>
            <p class="text-xs text-slate-400">
                The requested URL does not exist or has been relocated.
            </p>
        </div>

        <div class="p-4 rounded-2xl bg-slate-950/60 border border-slate-800 text-xs text-slate-400">
            Redirecting to <span class="font-bold text-white">ProPrint Studio</span> in <span id="timer" class="font-mono font-bold text-indigo-400">5</span> seconds...
        </div>

        <a href="index.html" class="w-full py-3 px-4 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white font-bold text-xs flex items-center justify-center gap-2 shadow-lg shadow-indigo-600/30 transition-all">
            <i class="fa-solid fa-house"></i>
            <span>Return to Studio Home</span>
        </a>

        <p class="text-[11px] text-slate-500">
            ProPrint Studio Pro &copy; 2026 Shaiekh Fielsouf Ansari
        </p>
    </div>

    <script>
        let count = 5;
        const timerEl = document.getElementById('timer');
        const interval = setInterval(() => {
            count--;
            if (timerEl) timerEl.textContent = count;
            if (count <= 0) {
                clearInterval(interval);
                window.location.href = 'index.html';
            }
        }, 1000);
    </script>
</body>
</html>
